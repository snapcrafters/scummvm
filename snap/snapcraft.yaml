name: scummvm
base: core26
version: "2026.4.0"
license: GPL-3.0-or-later
summary: ScummVM
description: |
  ScummVM allows you to run classic graphical adventure games and RPGs,
  provided you already have their data files. It replaces the executables
  shipped with the games, allowing you to play them on systems for which
  they were never designed.

  Supported games include classics from LucasArts, Sierra On-Line,
  Revolution Software, Cyan, Inc. and Westwood Studios, alongside many
  lesser-known adventures. A selection of freeware games is included.
confinement: strict
grade: stable
compression: lzo
platforms:
  amd64:
  arm64:
  armhf:

apps:
  scummvm:
    extensions: [gnome]
    command: bin/scummvm-launch.sh
    plugs:
      - unity7
      - audio-playback
      - alsa
      - network
      - network-bind
      - removable-media
      - home
      - gsettings
      - joystick
    environment:
      ALSA_CONFIG_PATH: $SNAP/etc/asound.conf
      ALSA_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
      LIBDECOR_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor/plugins-1
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libunity:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/speech-dispatcher
      ESPEAK_DATA_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/espeak-ng-data
      DBUS_FATAL_WARNINGS: "0"

  daemon:
    extensions: [gnome]
    command-chain:
      - bin/daemon-start.sh
    command: bin/scummvm-launch.sh -f
    daemon: simple
    restart-condition: always
    plugs:
      - audio-playback
      - alsa
      - network
      - network-bind
      - removable-media
      - joystick
    environment:
      SDL_VIDEODRIVER: wayland
      ALSA_CONFIG_PATH: $SNAP/etc/asound.conf
      ALSA_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
      LIBDECOR_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor/plugins-1
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libunity:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/speech-dispatcher
      ESPEAK_DATA_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/espeak-ng-data
      PULSE_SYSTEM: "1"
      PULSE_RUNTIME_PATH: /var/run/pulse

layout:
  /usr/share/scummvm:
    bind: $SNAP/usr/share/scummvm
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

parts:
  scummvm:
    source: https://github.com/scummvm/scummvm.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-depth: 1
    plugin: autotools
    autotools-configure-parameters:
      - --enable-release
      - --enable-tts
      - --enable-opl2lpt
      - --disable-debug
    build-packages:
      - liba52-0.7.4-dev
      - libasound2-dev
      - libcurl4-openssl-dev
      - libfaad-dev
      - libflac-dev
      - libfluidsynth-dev
      - libfreetype-dev
      - libfribidi-dev
      - libgif-dev
      - libgtk-3-dev
      - libieee1284-3-dev
      - libjpeg-dev
      - libmad0-dev
      - libmpeg2-4-dev
      - libogg-dev
      - libpng-dev
      - libsdl2-dev
      - libsdl2-net-dev
      - libsndio-dev
      - libspeechd-dev
      - libtheora-dev
      - libunity-dev
      - libvorbis-dev
      - zlib1g-dev
    stage-packages:
      - fonts-ubuntu
      - inotify-tools
      - liba52-0.7.4
      - libasound2-plugins
      - libcurl4t64
      - libfaad2
      - libflac14
      - libfluidsynth3
      - libfribidi0
      - libgif7
      - libieee1284-3t64
      - libjpeg8
      - libmad0
      - libmpeg2-4
      - libogg0
      - libpng16-16t64
      - libpulse0
      - libsdl2-2.0-0
      - libsdl2-net-2.0-0
      - libsndio7.0
      - libspeechd2
      - libtheoradec2
      - libunity9
      - libvorbis0a
      - libvorbisfile3
      - speech-dispatcher
      - speech-dispatcher-audio-plugins
      - speech-dispatcher-espeak-ng
      - zlib1g

  scripts:
    plugin: dump
    source: scripts
    stage-packages: [libdecor-0-plugin-1-gtk]

  games:
    plugin: dump
    source: https://downloads.scummvm.org/frs/extras/storefront/games-bundle.zip
    source-checksum: sha256/5c16f3db7fda3660d1bddb52e76aa27ada8eb8268872f5e045490f3eabb603e1
    organize:
      games-bundle: usr/share/scummvm/
